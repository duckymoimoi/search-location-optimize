services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    container_name: vn-poi-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.name=vn-poi-es
      - network.host=0.0.0.0
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  indexer:
    image: vn-poi/indexer:0.1.0-local
    build:
      context: .
      dockerfile: docker/Dockerfile.indexer
    container_name: vn-poi-indexer
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - POI_ES_URL=http://elasticsearch:9200
      - POI_INDEX=vn-poi-core-v3-me5-small
      - POI_EXPECTED_ROWS=179209
      - POI_POIS_PATH=/data/corpus/pois_core.parquet
      - POI_DOCUMENTS_PATH=/data/corpus/search_documents.parquet
      - POI_EMBEDDINGS_PATH=/data/embeddings/corpus_embeddings.npy
      - POI_ID_MAP_PATH=/data/embeddings/poi_ids.parquet
      - RECREATE_INDEX=${RECREATE_INDEX:-0}
    volumes:
      - ../../data/vietnam/poi_corpus_v3:/data/corpus:ro
      - ../../artifacts/embeddings/me5_small_v3:/data/embeddings:ro
    restart: "no"

  api:
    image: vn-poi/stage1-api:0.1.0-local
    build:
      context: ./docker
      dockerfile: Dockerfile.api
      args:
        POI_MODEL_ID: intfloat/multilingual-e5-small
    container_name: vn-poi-stage1-api
    depends_on:
      indexer:
        condition: service_completed_successfully
    environment:
      - POI_MODEL_ID=intfloat/multilingual-e5-small
      - POI_ES_URL=http://elasticsearch:9200
      - POI_INDEX=vn-poi-core-v3-me5-small
      - POI_EXPECTED_ROWS=179209
      - POI_CORPUS_VERSION=vn-poi-core-v3-semantic-address-dedup50
      - POI_SEARCH_POLICY=/app/api/search_policy.json
      - POI_RETRIEVAL_PROFILE=hybrid
      - POI_DEVICE=cuda
      - HF_HOME=/model-cache
      - GOONG_API_KEY=${GOONG_API_KEY:-}
    env_file:
      - path: .env
        required: false
    command:
      - python
      - -m
      - uvicorn
      - app:app
      - --app-dir
      - /app/api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./api:/app/api:ro
    mem_limit: 3g
    gpus: all
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5))['status'] == 'ok'"
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s

  # Self-contained FE image. Build-time VITE_* values are intentionally public
  # browser config; secrets for Directions stay in the API service only.
  web:
    image: vn-poi/web:0.1.0-local
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_GOONG_MAPTILES_KEY: ${GOONG_MAP_API_KEY:-}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
        VITE_CORPUS_VERSION: ${VITE_CORPUS_VERSION:-vn-poi-core-v3-semantic-address-dedup50}
    container_name: vn-poi-web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped

volumes:
  es_data:
    name: vn-poi-es-data
