services:
  opensearch:
    image: hanoi-poi/opensearch:3.8.0-local
    build:
      context: ../../training/opensearch
      dockerfile: Dockerfile.local
    container_name: hanoi-poi-opensearch
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    command:
      - -Ecluster.name=hanoi-poi-docker
      - -Enode.name=hanoi-poi-opensearch
      - -Ediscovery.type=single-node
      - -Enetwork.host=0.0.0.0
      - -Eplugins.security.disabled=true
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    volumes:
      - hanoi_poi_opensearch_data:/usr/share/opensearch/data
    mem_limit: 2g
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    image: hanoi-poi/stage1-api:0.1.0-local
    build:
      context: ./docker
      dockerfile: Dockerfile.api
    container_name: hanoi-poi-stage1-api
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - HANOI_POI_MODEL_DIR=/model
      - HANOI_POI_OPENSEARCH_URL=http://opensearch:9200
      - HANOI_POI_INDEX=hanoi-poi-stable-v1-release1
      - HANOI_POI_EXPECTED_ROWS=45692
      - HANOI_POI_SEARCH_POLICY=/app/api/search_policy.json
      - HANOI_POI_RETRIEVAL_PROFILE=hybrid
      - GOONG_API_KEY=${GOONG_API_KEY:-}
    env_file:
      - .env
    command:
      - python
      - -m
      - uvicorn
      - app:app
      - --app-dir
      - /app/api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./api:/app/api:ro
      - ./models/current:/model:ro
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5))['status'] == 'ok'"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  api-dense:
    image: hanoi-poi/stage1-api:0.1.0-local
    container_name: hanoi-poi-stage1-api-dense
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - HANOI_POI_MODEL_DIR=/model
      - HANOI_POI_OPENSEARCH_URL=http://opensearch:9200
      - HANOI_POI_INDEX=hanoi-poi-stable-v1-release1
      - HANOI_POI_EXPECTED_ROWS=45692
      - HANOI_POI_SEARCH_POLICY=/app/api/search_policy.json
      - HANOI_POI_RETRIEVAL_PROFILE=dense_only
    command:
      - python
      - -m
      - uvicorn
      - app:app
      - --app-dir
      - /app/api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./api:/app/api:ro
      - ./models/current:/model:ro
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5))['status'] == 'ok'"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  api-lexical:
    image: hanoi-poi/stage1-api:0.1.0-local
    container_name: hanoi-poi-stage1-api-lexical
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      - HANOI_POI_MODEL_DIR=/model
      - HANOI_POI_OPENSEARCH_URL=http://opensearch:9200
      - HANOI_POI_INDEX=hanoi-poi-stable-v1-release1
      - HANOI_POI_EXPECTED_ROWS=45692
      - HANOI_POI_SEARCH_POLICY=/app/api/search_policy.json
      - HANOI_POI_RETRIEVAL_PROFILE=lexical_only
    command:
      - python
      - -m
      - uvicorn
      - app:app
      - --app-dir
      - /app/api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./api:/app/api:ro
      - ./models/current:/model:ro
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5))['status'] == 'ok'"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

volumes:
  hanoi_poi_opensearch_data:
    name: hanoi-poi-opensearch-data
    external: true
